[package]
name = "glyph"
version = "0.3.1"
edition = "2024"
description = "A native Markdown editor built on gpui-fast"
license = "MIT"
build = "build.rs"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.8" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.8", features = ["wayland", "x11"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
directories = "6"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
